<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Snake Mobile</title>
    <style>
        body { background: #4a752c; display: flex; flex-direction: column; align-items: center; font-family: Arial; margin: 0; touch-action: manipulation; }
        #score { color: white; font-size: 24px; margin: 10px; }
        canvas { background: #aad751; border: 5px solid #578a34; box-shadow: 0 10px 20px rgba(0,0,0,0.3); }
        .controls { display: grid; grid-template-columns: repeat(3, 70px); grid-template-rows: repeat(2, 70px); gap: 10px; margin-top: 20px; }
        button { width: 70px; height: 70px; background: #578a34; color: white; border: none; border-radius: 10px; font-size: 20px; font-weight: bold; }
        .up { grid-column: 2; }
        .left { grid-column: 1; grid-row: 2; }
        .down { grid-column: 2; grid-row: 2; }
        .right { grid-column: 3; grid-row: 2; }
    </style>
</head>
<body>
    <div id="score">Maçãs: 0</div>
    <canvas id="snake" width="300" height="300"></canvas>

    <div class="controls">
        <button class="up" onclick="setDir('UP')">↑</button>
        <button class="left" onclick="setDir('LEFT')">←</button>
        <button class="down" onclick="setDir('DOWN')">↓</button>
        <button class="right" onclick="setDir('RIGHT')">→</button>
    </div>

    <script>
        const canvas = document.getElementById("snake");
        const ctx = canvas.getContext("2d");
        const box = 20;
        let score = 0;
        let snake = [{x: 8 * box, y: 8 * box}];
        let food = { x: Math.floor(Math.random()*14+1)*box, y: Math.floor(Math.random()*14+1)*box };
        let d;

        function setDir(dir) {
            if(dir == "LEFT" && d != "RIGHT") d = "LEFT";
            if(dir == "UP" && d != "DOWN") d = "UP";
            if(dir == "RIGHT" && d != "LEFT") d = "RIGHT";
            if(dir == "DOWN" && d != "UP") d = "DOWN";
        }

        function draw() {
            ctx.fillStyle = "#aad751";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for(let i=0; i<snake.length; i++) {
                ctx.fillStyle = (i==0) ? "#4e7cf6" : "#4568db"; // Cobra azul estilo moderna
                ctx.fillRect(snake[i].x, snake[i].y, box, box);
            }

            ctx.fillStyle = "#e74c3c"; // Maçã
            ctx.fillRect(food.x, food.y, box, box);

            let snakeX = snake[0].x;
            let snakeY = snake[0].y;

            if(d == "LEFT") snakeX -= box;
            if(d == "UP") snakeY -= box;
            if(d == "RIGHT") snakeX += box;
            if(d == "DOWN") snakeY += box;

            if(snakeX == food.x && snakeY == food.y) {
                score++;
                document.getElementById("score").innerHTML = "Maçãs: " + score;
                food = { x: Math.floor(Math.random()*14+1)*box, y: Math.floor(Math.random()*14+1)*box };
            } else {
                snake.pop();
            }

            let newHead = { x: snakeX, y: snakeY };

            if(snakeX < 0 || snakeX >= canvas.width || snakeY < 0 || snakeY >= canvas.height || collision(newHead, snake)) {
                clearInterval(game);
                alert("Fim de Jogo! Você comeu " + score + " maçãs.");
                location.reload();
            }
            snake.unshift(newHead);
        }

        function collision(head, array) {
            for(let i=0; i<array.length; i++) {
                if(head.x == array[i].x && head.y == array[i].y) return true;
            }
            return false;
        }

        let game = setInterval(draw, 150);
    </script>
</body>
</html>
